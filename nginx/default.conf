upstream dienzt {
    server api:8000;
}



map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

# setting for time limit
# limit_req_zone $binary_remote_addr zone=one:10m rate=30r/m;

server {
        listen 80;
        listen [::]:80;

        server_tokens off;

        location / {
            return 301 https://$host$request_uri;
        }
    }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Wenn Zugriff auf ausserhalb des Containers aus irgendwelchen Gründen nicht funktioniert, die Zertifikate in den Container kopieren.
    #ssl_certificate     /etc/nginx/fullchain.pem;
    #ssl_certificate_key /etc/nginx/privkey.pem;
    # Domain durch die eigene ersetzen (Let's-Encrypt-Verzeichnis auf dem Host)
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;


    location / {
        proxy_pass http://dienzt;
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 75s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300;

            # limit requests from ip to prevent DDOS
            #limit_req zone=one;
    }

    location /media/ {
        alias /code/media/;
    }

    location /static/ {
        alias /code/static/;
    }
}
