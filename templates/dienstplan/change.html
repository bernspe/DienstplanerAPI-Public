<!doctype html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html charset=UTF-8"/>
    <title>Dienstplanung geändert</title>
</head>

<body>
<table style="margin: auto">
    <tr>

        <td style="padding: 20px 0; text-align: center"><img
                src="https://renecol.org/wp-content/uploads/2023/12/generate{{ random }}.jpg" alt="alt_text" border="0">
        </td>

    </tr>
    <tr>
        <td style="padding: 40px; text-align: center; font-family: sans-serif; font-size: 16px; mso-height-rule: at-least; line-height: 28px; color: #555555;">
            <h1>Der Dienstplan für {{ add_info.month }} wurde geändert.</h1>
        </td>
    </tr>
</table>

    <table style="margin: 3rem; font-family: sans-serif; font-size: 14px;">
        <tr>
            <th style="padding: 1rem;">Datum</th>
            <th style="padding: 1rem;">Dienstgruppe</th>
            <th style="padding: 1rem;">Vorgang</th>
            <th style="padding: 1rem;">Arzt</th>
        </tr>
        {% for change in add_info.changes %}
            <tr style="margin: 1rem;">
                <td style="padding: 1rem;">{{ change.date }}</td>
                <td style="padding: 1rem;">{{ change.gruppenname }}</td>
                <td style="padding: 1rem;">{{ change.actionname }}</td>
                <td style="padding: 1rem;">{{ change.arztname }}</td>
            </tr>
        {% endfor %}
    </table>

<table style="margin: auto">
    <tr>
        <td style="padding: 20px 0; text-align: center">
            <a href="https://dienzt.renecol.org"><h2>Hier geht es zum DienZt Tool ...</h2></a>
        </td>
    </tr>

</table>
</body>
</html>
